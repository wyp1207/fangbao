# 访问日志脱敏：不记录 query（token/password 在 query 里），回调路径里的 run token 也盖掉
map $uri $safe_uri {
    default                       $uri;
    ~^/api/v1/callbacks/jcrob/.+  /api/v1/callbacks/jcrob/***;
}

log_format safe '$remote_addr - [$time_local] "$request_method $safe_uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 平台 API 反代
    location /api/ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://jc-server:8000/health;
    }

    # 平台自己的 WebSocket（不是机器人 WS 3547）
    location /ws/ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/access.log safe;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
