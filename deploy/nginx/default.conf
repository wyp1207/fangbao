# 访问日志脱敏：不记录 query（token 可能在 query 里），回调路径里的 token 也盖掉
map $uri $safe_uri {
    default                       $uri;
    ~^/api/v1/callbacks/jcrob/.+  /api/v1/callbacks/jcrob/***;
}

log_format safe '$remote_addr - [$time_local] "$request_method $safe_uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 地图图纸最大 20MB，留点余量
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 平台 API 反代
    location /api/ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 录像 Range 点播 / 地图文件下载
        proxy_buffering off;
    }

    # 流式接口（MJPEG / 抓帧）：不能缓冲，否则画面一顿一顿的。
    # 用正则精确匹配，避免 /api/v1/videos 被 301 到带斜杠版本造成重定向死循环
    location ~ ^/api/v1/videos/[0-9]+/(mjpeg|snapshot)$ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # go2rtc 同源反代：宿主机上跑着 go2rtc（1984）
    # 前端用 /go2rtc/... 播放，不用暴露 1984，也没有跨域
    location /go2rtc/ {
        proxy_pass http://host.docker.internal:1984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://jc-server:8000/health;
    }

    # 平台自己的 WebSocket（不是机器人 WS 3547）
    location /ws/ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/access.log safe;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
