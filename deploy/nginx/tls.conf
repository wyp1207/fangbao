# HTTPS 版 nginx 配置：和 default.conf 保持同等能力（限流/脱敏/流式/WS/静态缓存）
# 开了 TLS 只是加一层传输安全，不能反而把 HTTP 版的能力丢掉

map $http_x_api_key $rl_key {
    default          $http_x_api_key;
    ""               $binary_remote_addr;
}
limit_req_zone $rl_key zone=api_key:10m rate=20r/s;
limit_req_status 429;

map $uri $safe_uri {
    default                       $uri;
    ~^/api/v1/callbacks/jcrob/.+  /api/v1/callbacks/jcrob/***;
}

log_format safe '$remote_addr - [$time_local] "$request_method $safe_uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# HTTP 只做跳转（保留 ACME 校验路径）
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    location / { try_files $uri $uri/ /index.html; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /openapi.json { proxy_pass http://jc-server:8000/openapi.json; proxy_set_header Host $host; }
    location = /docs { proxy_pass http://jc-server:8000/docs; proxy_set_header Host $host; }

    location /api/ {
        limit_req zone=api_key burst=40 nodelay;
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 流式接口（MJPEG / 抓帧）不能缓冲
    location ~ ^/api/v1/videos/[0-9]+/(mjpeg|snapshot)$ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /go2rtc/ {
        proxy_pass http://host.docker.internal:1984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /health { proxy_pass http://jc-server:8000/health; }

    location /ws/ {
        proxy_pass http://jc-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/access.log safe;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
