# 防爆机器人巡检平台 · 部署编排
# 目标机：192.168.8.40（共享机，已跑 52 个容器）
# 约定：所有资源加 jc- 前缀；只发布 nginx 的 8099，server / mysql 不占宿主端口
name: jcrob

services:
  jc-server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    image: jc-server:0.2.0
    container_name: jc-server
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      JC_ENV: prod
      JC_DB_URL: mysql+pymysql://jcrob:${JC_DB_PASSWORD:-changeme}@jc-mysql:3306/jcrob?charset=utf8mb4
      # 浏览器侧走 nginx 同源反代，不用暴露 go2rtc 的 1984
      JC_GO2RTC_PUBLIC_BASE: /go2rtc
      # 后端探活/取流走宿主上已在跑的 go2rtc（35 路真实流）；容器内直连相机仍可兜底
      JC_GO2RTC_BASE: ${JC_GO2RTC_BASE:-http://192.168.8.40:1984}
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      jc-mysql:
        condition: service_healthy
    networks: [jc-net]
    # 共享机上必须限资源，否则 MySQL 吃满内存会连累邻居
    mem_limit: 2g
    cpus: 1.5
    volumes:
      # 录像 / 地图 / 上传 / 日志全部落在 /data，容器重建不丢
      - /data/jcrob-platform/recordings:/app/data/recordings
      - /data/jcrob-platform/maps:/app/data/maps
      - /data/jcrob-platform/backups:/app/data/backups
      - /data/jcrob-platform/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  jc-mysql:
    image: mysql:8.4.4
    container_name: jc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=384M
      - --max-connections=200
    environment:
      MYSQL_DATABASE: jcrob
      MYSQL_USER: jcrob
      MYSQL_PASSWORD: ${JC_DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${JC_DB_ROOT_PASSWORD:-changeme-too}
      TZ: Asia/Shanghai
    networks: [jc-net]
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - /data/jcrob-platform/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${JC_DB_ROOT_PASSWORD:-changeme-too}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  jc-nginx:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: jc-nginx:0.2.0
    container_name: jc-nginx
    restart: unless-stopped
    depends_on: [jc-server]
    networks: [jc-net]
    mem_limit: 128m
    # 只发布这一个端口；8099 在 8.40 上实测空闲
    ports:
      - "8099:80"
    volumes:
      # 首页视频 iframe 走 /go2rtc/，反代到宿主上的 go2rtc
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  jc-go2rtc:
    # 默认不启动：8.40 宿主机已有 go2rtc（35 路真实流），再起一个只会造成
    # "两套中继、配置各一半"的混乱。需要自带中继时用 profiles 显式开启。
    profiles: ["standalone-relay"]
    image: alexxit/go2rtc:latest
    container_name: jc-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    networks: [jc-net]

networks:
  jc-net:
    name: jc-net
    driver: bridge
