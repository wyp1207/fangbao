name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 单元/接口测试
        env:
          JC_ENV: test
          JC_ROBOT_MODE: mock
        run: python -m pytest -q
      - name: 迁移脚本可执行性（空库升级到 head）
        env:
          JC_DB_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 类型检查 + 构建
        run: npm run build
