[project]
name = "jcrob-platform-server"
version = "0.1.0"
description = "防爆机器人巡检平台后端（FastAPI）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "PyMySQL>=1.1",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    # 现场气体传感器在导航主机上走串口（Modbus RTU），平台通过 SSH 读
    "paramiko>=3.4",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
